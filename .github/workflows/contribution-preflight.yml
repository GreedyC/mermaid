name: Self-loop contribution preflight
on:
  push:
    branches: [codex/8080-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 616dd24
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: git rev-parse HEAD
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec vitest run --maxWorkers=2
      - run: pnpm test:check:tsc
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser geometry and rendering checks (capture mode)
        env:
          RUN_VISUAL_TEST: 'true'
        run: pnpm exec playwright test e2e/rendering/flowchart e2e/rendering/class/classDiagram-v3.spec.js e2e/rendering/er/erDiagram-unified.spec.js --workers=2
